services:
  dorch:
    build:
      context: ../..
      dockerfile: .agents/dorch/Dockerfile
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    image: econ-workshop-dorch:latest
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    security_opt:
      - no-new-privileges:true
    volumes:
      # Only this repository is visible inside the container (host filesystem stays hidden)
      - ../..:/workspace
      # OS-enforced read-only wall on raw research data
      - ../../data/raw:/workspace/data/raw:ro
      # Dedicated Docker volume for isolated git worktrees (one per parallel worker)
      - dorch_worktrees:/workspace-worktrees
      # Persistent credentials and caches across container runs
      - dorch_gh:/home/agent/.config/gh
      - dorch_claude:/home/agent/.claude
      - dorch_codex:/home/agent/.codex
      - dorch_pi:/home/agent/.pi
      - dorch_herdr:/home/agent/.config/herdr
      - dorch_uvcache:/home/agent/.cache/uv

volumes:
  dorch_worktrees:
  dorch_gh:
  dorch_claude:
  dorch_codex:
  dorch_pi:
  dorch_herdr:
  dorch_uvcache:
