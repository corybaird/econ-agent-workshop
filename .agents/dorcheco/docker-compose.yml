services:
  dorcheco:
    build:
      context: ../..
      dockerfile: .agents/dorcheco/Dockerfile
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    image: dorcheco:latest
    stdin_open: true
    tty: true
    env_file:
      - path: .env
        required: false
    security_opt:
      - no-new-privileges:true
    volumes:
      # Only this repository is visible inside the container (host filesystem stays hidden)
      - ../..:/workspace
      # OS-enforced read-only wall on raw research data
      - ../../data/raw:/workspace/data/raw:ro
      # Dedicated Docker volume for isolated git worktrees (one per parallel worker)
      - dorcheco_worktrees:/workspace-worktrees
      # Persistent credentials and caches across container runs
      - dorcheco_gh:/home/agent/.config/gh
      - dorcheco_claude:/home/agent/.claude
      - dorcheco_codex:/home/agent/.codex
      - dorcheco_pi:/home/agent/.pi
      - dorcheco_herdr:/home/agent/.config/herdr
      - dorcheco_uvcache:/home/agent/.cache/uv

volumes:
  dorcheco_worktrees:
  dorcheco_gh:
  dorcheco_claude:
  dorcheco_codex:
  dorcheco_pi:
  dorcheco_herdr:
  dorcheco_uvcache:
