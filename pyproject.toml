[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "econ-agent-harness"
version = "0.6.0"
description = "Reproducible economic research workflows for sandboxed AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai-harness[coder]>=0.68.0",
  "stats-transformer>=1.11.1",
  "auto-econ-sentiment>=1.0.2",
  "econ-pdf-extract>=0.1.0",
  "reproducible-econ>=0.1.0",
  "jupyter>=1.1.1",
]


[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.hatch.build.targets.wheel]
packages = ["src/econ_agent_harness", "src/economic_libraries"]
