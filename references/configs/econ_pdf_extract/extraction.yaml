# Synthetic example-paper extraction and offline claim evaluation.
# Consumed by src/economic_libraries/econ_pdf_extract/example1.py and example2.py
# The PDF is a synthetic 2-page paper generated by econ-pdf-extract/examples/make_example_paper.py.
input:
  pdf_path: data/raw/example_paper.pdf

eval:
  refs_dir: references/configs/econ_pdf_extract
  seq_threshold: 0.72
  f1_threshold: 0.75

# Reference claims match the synthetic paper verbatim, so both thresholds
# must pass fully (recall = 1.0, precision = 1.0).
expected_eval:
  recall: 1.0
  precision: 1.0
