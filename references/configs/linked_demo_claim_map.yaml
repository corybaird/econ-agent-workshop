# Human-confirmed mapping: extracted claim (econ-pdf-extract draft) -> spec
# (references/configs/linked_demo_pipeline.yaml) + published value + tolerance.
#
# Each entry was confirmed by hand against the PDF text of NBER Working Paper
# 19260 (verified quote spans below). Only claims whose number is literally
# present in a draft quote are mapped; numbers the replication does not
# estimate (instantaneous forward rates, stock prices, model parameters) stay
# unmapped. Coef is the published value in basis points (PDF) expressed in
# the regression's units (1 basis point = 0.01 percentage points -> 110bp = 1.10).
entries:
  - claim_id: CLM-013
    quote_span: "peaks at 110 basis points for the 2-year yield"
    page: 12
    spec: nominal_2y
    key_variable: ns
    coef: 1.10
    tol: 0.10
  - claim_id: CLM-013
    quote_span: "38 basis points for the 10-year yield"
    page: 12
    spec: nominal_10y
    key_variable: ns
    coef: 0.38
    tol: 0.05
