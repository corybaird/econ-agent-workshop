# Deterministic synthetic Phillips-curve stage pipeline.
# Consumed by src/economic_libraries/reproducible_econ/example1.py (cold run)
# and example2.py (cached rerun). Stages ship with reproducible-econ's
# macro_demo; parquet cache lives under data/cache/, report outputs under
# data/final/, both anchored to this repo root by the config loader.
project:
  name: workshop_reproducible_econ
  seed: 42

data:
  economies: [ECON_A, ECON_B, ECON_C]
  n_quarters: 30
  start_year: 2015
  start_quarter: "2015Q1"
  end_quarter: "2022Q2"
  lag_periods: 1
  dgp:
    intercept: 2.0
    slope_unemp: -0.45
    persistence: 0.55
    noise_std: 0.25

estimation:
  winsorize_pct: 0.0
  specs:
    - name: baseline_ols
      dependent: inflation
      regressors: [unemployment_gap, lag_inflation]

output:
  cache_dir: data/cache/reproducible_econ_example
  reports_dir: data/final/reproducible_econ_example/${run_timestamp}
  tables_dir: ${output.reports_dir}/tables

tables:
  strict: true
  exports:
    - key: summary_stats
      filename: summary_stats.tex
      caption: "Synthetic Macro Panel Summary Statistics"
      label: "tab:summary_stats"
      float_format: "%.3f"
      columns: [variable, mean, std, min, max, n]
    - key: estimates
      filename: phillips_estimates.tex
      caption: "Synthetic Phillips Curve OLS Estimates"
      label: "tab:phillips_estimates"
      float_format: "%.4f"
      columns: [spec_name, key_variable, coef, se, pval, n_obs, r2]

default_module: reproducible_econ.examples.macro_demo

stages:
  - name: prepare_data
    class: PrepareMacroDataStage
    phase: data
    produces: [panel, summary_stats]
    cache: true
    cache_inputs: [data, project]

  - name: estimate_ols
    class: EstimatePhillipsStage
    phase: estimate
    requires: [panel]
    produces: [estimates]
    cache: true
    cache_inputs: [estimation]

  - name: export_tables
    module: reproducible_econ.emitters.tables
    class: LatexTableStage
    phase: report
    requires: [summary_stats, estimates]
    cache: false
